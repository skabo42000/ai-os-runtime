name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: find scripts tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm run demo
      - run: npm run demo:failures
      - run: npm test
